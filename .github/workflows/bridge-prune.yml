# Delete the throwaway bridge/** branches the Firestore bridge leaves behind.
#
# Why a workflow and not just `git push --delete`: a Claude Code cloud session's
# git access allows push and force-push but NOT ref deletion (the proxy answers
# 403), and the GitHub MCP toolset has no delete-branch call. So sessions cannot
# clean up after themselves, and eleven dead refs had piled up by 2026-08-04.
# A runner's GITHUB_TOKEN can delete refs, so the cleanup happens here.
#
# Anything touched in the last 10 minutes is left alone — that is a bridge call
# that may still be in flight, waiting for the session to fetch its answer.
name: Prune bridge branches

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    # Every bridge call sweeps up the ones before it, so they can never pile up
    # again — which they did (eleven refs) when only main triggered this.
    branches: [main, "bridge/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale bridge/** refs
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 10 * 60 * 1000;
            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/bridge/',
            });
            if (refs.length === 0) { core.info('no bridge branches'); return; }
            let deleted = 0;
            for (const r of refs) {
              const name = r.ref.replace('refs/heads/', '');
              const commit = await github.rest.git.getCommit({
                owner: context.repo.owner, repo: context.repo.repo, commit_sha: r.object.sha,
              });
              const when = Date.parse(commit.data.committer.date);
              if (when > cutoff) { core.info(`skip ${name} (in flight)`); continue; }
              await github.rest.git.deleteRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: r.ref.replace('refs/', ''),
              });
              core.info(`deleted ${name}`);
              deleted++;
            }
            core.info(`${deleted} deleted, ${refs.length - deleted} left`);
